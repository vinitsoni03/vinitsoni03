name: Generate Profile Cards

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Replaces github-readme-stats.vercel.app, whose public deployment is paused.
      # Runs before snk: snk's Docker container creates dist/ as root, which blocks later writes.
      - name: Generate stats + top-languages cards
        run: python3 scripts/stats_cards.py dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: vinitsoni03
          outputs: |
            dist/snake-amber.svg?color_snake=#e8a33d&color_dots=#141414,#3a2414,#6b4518,#a8661c,#e8a33d
            dist/github-contribution-grid-snake.svg

      - name: Push cards to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
